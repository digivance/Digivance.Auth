name: PR Pipeline
on:
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Install PNPM and Vite
      run: npm install -g pnpm vite

    - name: Build UI
      run: cd ./src/digivance_auth/app && pnpm run build

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Assemblies
      run: dotnet build --no-restore -c Release

    - name: Test Assemblies
      run: dotnet test --verbosity normal

    - name: Get package version
      env:
        RUN_NUMBER: ${{ github.run_number }}
      run: >
        project_version=$(grep '<Version>' < .src/Digivance.Auth.Api/Digivance.Auth.Api.csproj | sed 's/.*<Version>\(.*\)<\/Version>/\1/') &&
        echo "PROJECT_VERSION=${project_version//[$'\t\r\n']}" >> $GITHUB_ENV &&

        package_version="${project_version}-pre.${RUN_NUMBER}" &&
        echo "PACKAGE_VERSION=${package_version//[$'\t\r\n']}" >> $GITHUB_ENV

    - name: ACR Build
      uses: azure/acr-build@v1
      with:
        service_principal: ${{ secrets.ACR_PRINCIPAL }}
        service_principal_password: ${{ secrets.ACR_PASSWORD }}
        tenant: ${{ secrets.ACR_TENANT }}
        registry: ${{ secrets.ACR_NAME }}
        repository: ${{ secrets.ACR_REPO }}
        image: ${{ secrets.ACR_REPO }}
        tag: ${{ env.PACKAGE_VERSION }}
        dockerfille: ./docker/api/dockerfile
